services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: strategos
      POSTGRES_USER: strategos
      POSTGRES_PASSWORD: strategos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strategos -d strategos"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://strategos:strategos@db:5432/strategos
      APP_NAME: Skits Strategos Backend
      MAX_UPLOAD_BYTES: 25000000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
